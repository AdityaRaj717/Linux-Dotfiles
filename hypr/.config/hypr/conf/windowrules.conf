##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}
# Aesthetic window rules

# Floating windows with better styling
windowrule {
  name = windowrule-1
  float = on
  center = on
  match:class = ^(pavucontrol|nm-connection-editor|blueman-manager)$
}

windowrule {
  name = windowrule-2
  size = 800 600
  match:class = ^(pavucontrol|nm-connection-editor)$
}


# Rofi styling
windowrule {
  name = windowrule-3
  float = on
  border_size = 0
  no_blur = on
  center = on
  match:class = ^(Rofi)$
}


# Transparent terminals (optional - adjust opacity as needed)
windowrule {
  name = windowrule-4
  opacity = 0.95 0.85
  match:class = ^(kitty|Alacritty)$
}


# Picture-in-picture
windowrule {
  name = windowrule-5
  float = on
  pin = on
  size = (monitor_w*0.25) (monitor_h*0.25)
  move = ((monitor_w*0.74)) ((monitor_h*0.74))
  match:title = ^(Picture-in-Picture)$
}


# Better file picker
windowrule {
  name = windowrule-6
  float = on
  size = (monitor_w*0.6) (monitor_h*0.7)
  center = on
  match:title = ^(Open File|Save File|Select)$
}

