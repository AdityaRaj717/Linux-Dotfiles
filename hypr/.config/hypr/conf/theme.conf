#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    
    # Modern aesthetic borders
    col.active_border = $primary $secondary 45deg
    col.inactive_border = $inactive_border 
    resize_on_border = true
    allow_tearing = false
    # layout = scrolling
    layout = dwindle
}

decoration {
    # Rounded corners for modern aesthetic
    rounding = 12
    
    active_opacity = 1
    inactive_opacity = 0.85
    fullscreen_opacity = 1
    
    blur {
        enabled = true
        size = 10
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        noise = 0.15
        popups = true
        popups_ignorealpha = 0.6
    }
    
    # Window dimming for inactive windows
    dim_inactive = true
    dim_strength = 0.00
    dim_special = 0.5
}

group {
    col.border_active = $primary $secondary 45deg
    col.border_inactive = $inactive_border
    
    groupbar {
        text_color = $on_surface
        col.active = $primary
        col.inactive = $surface_container
        font_family = GeistMono Nerd Font Propo Bold
        font_size = 11
        height = 18
        priority = 3
        render_titles = true
        gradients = true
    }
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}
